default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "colheita") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "colheita") %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "colheita_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME_TEST", "colheita_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "colheita_production") %>
  url: <%= ENV["DATABASE_URL"] %>
